 <!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tesseract-test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css">
    <script src="app.js" defer></script>
  </head>
  <body>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <div class="title"><span id="figureName">Tesseract</span> · 4D → 3D Projection</div>
<div class="hint">drag to orbit · scroll to zoom</div>

<!-- Each button's accent colour comes from the `--shape-*` custom property
     that `data-shape` maps to in style.css, which is the exact colour that
     figure paints its highlighted cell with. ShapePicker (shapePicker.ts)
     handles the clicks and keeps `is-active` / `aria-pressed` in sync. -->
<div class="shape-toggle" role="group" aria-label="4D figure">
  <button
    type="button"
    class="shape-btn is-active"
    data-shape="tesseract"
    aria-pressed="true"
    title="Tesseract"
  >
    <span class="sr-only">Tesseract</span>
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <rect x="7" y="7" width="24" height="24" />
      <rect x="17" y="17" width="24" height="24" />
      <line x1="7" y1="7" x2="17" y2="17" />
      <line x1="31" y1="7" x2="41" y2="17" />
      <line x1="7" y1="31" x2="17" y2="41" />
      <line x1="31" y1="31" x2="41" y2="41" />
    </svg>
  </button>

  <button
    type="button"
    class="shape-btn"
    data-shape="hypersphere"
    aria-pressed="false"
    title="HyperSphere"
  >
    <span class="sr-only">HyperSphere</span>
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="24" r="16" />
      <ellipse cx="24" cy="24" rx="16" ry="5" />
      <ellipse cx="24" cy="24" rx="16" ry="5" transform="rotate(60 24 24)" />
    </svg>
  </button>

  <button
    type="button"
    class="shape-btn"
    data-shape="hyperpyramid"
    aria-pressed="false"
    title="HyperPyramid"
  >
    <span class="sr-only">HyperPyramid</span>
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <rect x="8" y="22" width="32" height="20" />
      <line x1="24" y1="6" x2="8" y2="22" />
      <line x1="24" y1="6" x2="40" y2="22" />
      <line x1="24" y1="6" x2="40" y2="42" />
      <line x1="24" y1="6" x2="8" y2="42" />
    </svg>
  </button>
</div>

<div class="panel">
  <div class="corner-tr"></div>
  <div class="corner-br"></div>

  <div class="row">
    <div class="row-label"><b>XW</b> plane <span class="value" id="xwValue">0°</span></div>
    <input type="range" id="xwSlider" min="-180" max="180" value="0" step="1" />
  </div>
  <div class="row">
    <div class="row-label"><b>YW</b> plane <span class="value" id="ywValue">0°</span></div>
    <input type="range" id="ywSlider" min="-180" max="180" value="0" step="1" />
  </div>
  <div class="row">
    <div class="row-label"><b>ZW</b> plane <span class="value" id="zwValue">0°</span></div>
    <input type="range" id="zwSlider" min="-180" max="180" value="0" step="1" />
  </div>

  <div class="controls-bottom">
    <label class="toggle">
      <input type="checkbox" id="autoRotate" checked />
      auto-rotate
    </label>
    <button class="reset-btn" id="resetBtn">Reset</button>
  </div>
</div>

<div class="legend" id="legend" data-shape="tesseract">
  <div class="swatch"></div> <span id="legendLabel">inner cell (w = −1)</span>
</div>

  </body>
</html>
